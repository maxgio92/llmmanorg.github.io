<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="The NeMo check. Top: the same 10.55 second clip runs through NeMo and through llmman, and every stage is compared. Mel spectrogram: largest gap 0.000129. Encoder blocks: F16 0.04 to 0.12 percent, Q8_0 0.38 to 3.8 percent. Decoder: F16 0.008 to 0.08 percent, Q8_0 0.11 to 2.1 percent. Tokens and text: the same 33 tokens and the same text. Bottom: the same ranges as bars on a log scale, with the F16 encoder sitting on the half-precision floor of 1 part in 2,000, and Q8_0 about ten times higher" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7aa2f7"/></marker></defs>
